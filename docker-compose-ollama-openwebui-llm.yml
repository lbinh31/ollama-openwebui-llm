### DOCKER COMPOSE RUN OLLAMA:LATEST AND OPEN WEBUI
### GEMINI "docker compose run ollama:latest and openwebui. Include persistent data binding."
### https://hub.docker.com/r/ollama/ollama/tags

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama_data:/root/.ollama  # Persist model data.  **CRITICAL for long-term use**
      - ./init-ollama.sh:/init-ollama.sh
    ports:
      - "11434:11434" #  Ollama API port
    entrypoint: ["/bin/sh", "-c"]
    command: "chmod +x /init-ollama.sh && /init-ollama.sh && /init-ollama.sh"
    restart: unless-stopped

  openwebui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: open-webui
    ports:
      - "3000:8080"
    volumes:
      - open-webui_data:/app/backend/data

volumes:
  ollama_data:  # Define the persistent volume for Ollama
  open-webui_data:

#################################################################################################

